# PostgreSQL local pour le développement et les tests. La production utilise un
# PostgreSQL hébergé (Supabase, Neon…) : seule DATABASE_URL change.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      # Accessible uniquement depuis cette machine. Port modifiable si 55432 est déjà pris : DB_PORT=… docker compose up -d
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
